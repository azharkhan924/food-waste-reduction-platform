# ============================================
# Loki Configuration (Beginner-Friendly)
# ============================================
# Loki is the log storage engine. It receives logs
# from Promtail and stores them so Grafana can query them.

auth_enabled: false

server:
  http_listen_port: 3100

common:
  path_prefix: /tmp/loki
  storage:
    filesystem:
      chunks_directory: /tmp/loki/chunks
      rules_directory: /tmp/loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2020-10-24
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  # Allow logs up to 30 days old to be ingested (useful when testing)
  reject_old_samples: true
  reject_old_samples_max_age: 720h

# How long to keep logs (7 days for learning)
compactor:
  retention_enabled: true
  retention_delete_delay: 2h
