<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Manage Users</title>
<link rel="stylesheet" th:href="@{/css/style.css}">
<link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body>
<div id="mymenu">
<ul>
<li><a th:href="@{/admin/dashboard}">Dashboard</a></li>
<li><a th:href="@{/admin/users}">Users</a></li>
<li><a th:href="@{/admin/donations}">Donations</a></li>
<li><a th:href="@{/logout}">Logout</a></li>
</ul>
</div>

<div class="main-box" style="max-width:1100px;">

<h1>Manage Users</h1>

<div class="filter-bar">
<form th:action="@{/admin/users}" method="get" style="display:flex; gap:10px; align-items:center; flex-wrap:wrap;">
<select name="filterRole" style="width:150px;">
<option value="">All</option>
<option value="Restaurant" th:selected="${filterRole == 'Restaurant'}">Restaurant</option>
<option value="NGO" th:selected="${filterRole == 'NGO'}">NGO</option>
</select>
<button type="submit" class="accept-btn">Filter</button>
<a th:href="@{/admin/users}" class="del-btn" style="text-decoration:none; padding:8px 14px;">Clear</a>
</form>
</div>

<div class="filter-bar" style="margin-bottom:25px;">
<p style="color:#c8e6c9; font-size:15px; margin-bottom:10px; font-weight:600;">Add New User</p>
<form th:action="@{/admin/add-user}" method="post" style="display:flex; gap:8px; flex-wrap:wrap; align-items:center;">
<input type="text" name="name" placeholder="Name" required style="flex:1; min-width:120px;">
<input type="email" name="email" placeholder="Email" required style="flex:1; min-width:150px;">
<input type="password" name="password" placeholder="Password" required style="flex:1; min-width:100px;">
<select name="role" required style="width:130px;">
<option value="">Role</option>
<option value="Restaurant">Restaurant</option>
<option value="NGO">NGO</option>
</select>
<button type="submit" class="add-btn" style="margin:0;">Add</button>
</form>
</div>

<div th:if="${#lists.isEmpty(users)}">
<p class="no-data">No users found.</p>
</div>

<table class="mytable" th:if="${!#lists.isEmpty(users)}">
<thead>
<tr>
<th>ID</th>
<th>Name</th>
<th>Email</th>
<th>Role</th>
<th>Status</th>
<th>Actions</th>
</tr>
</thead>
<tbody>
<tr th:each="u : ${users}" th:style="${u.blocked ? 'opacity:0.5' : ''}">
<td th:text="${u.id}"></td>
<td th:text="${u.name}"></td>
<td th:text="${u.email}"></td>
<td>
<span class="st-pending" th:if="${u.role == 'Restaurant'}">Restaurant</span>
<span class="st-accepted" th:if="${u.role == 'NGO'}">NGO</span>
<span class="st-picked" th:if="${u.role == 'Admin'}">Admin</span>
</td>
<td>
<span class="st-picked" th:if="${!u.blocked}">Active</span>
<span class="st-blocked" th:if="${u.blocked}">Blocked</span>
</td>
<td style="display:flex; gap:5px;">
<a th:href="@{/admin/block/{id}(id=${u.id})}" onclick="return confirm('Sure?')">
<button class="block-btn" th:text="${u.blocked ? 'Unblock' : 'Block'}">Block</button>
</a>
<button class="edit-btn" th:data-id="${u.id}" th:data-name="${u.name}" th:data-email="${u.email}" th:data-role="${u.role}" onclick="openEdit(this)">Edit</button>
<a th:href="@{/admin/delete-user/{id}(id=${u.id})}" onclick="return confirm('Delete this user?')">
<button class="del-btn" style="padding:5px 12px;">Delete</button>
</a>
</td>
</tr>
</tbody>
</table>

</div>

<div id="editModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.7); z-index:999; justify-content:center; align-items:center;">
<div style="background:rgba(30,30,30,0.97); border:1px solid rgba(102,187,106,0.25); border-radius:12px; padding:30px; width:400px; max-width:90%;">
<h2 style="color:#66bb6a; margin-bottom:15px;">Edit User</h2>
<form th:action="@{/admin/update-user}" method="post">
<input type="hidden" name="id" id="editId">
<label>Name</label>
<input type="text" name="name" id="editName" required>
<label>Email</label>
<input type="email" name="email" id="editEmail" required>
<label>Role</label>
<select name="role" id="editRole">
<option value="Restaurant">Restaurant</option>
<option value="NGO">NGO</option>
<option value="Admin">Admin</option>
</select>
<div style="display:flex; gap:10px; margin-top:18px;">
<button type="submit" class="add-btn" style="margin:0; flex:1;">Save</button>
<button type="button" class="del-btn" style="flex:1;" onclick="document.getElementById('editModal').style.display='none'">Cancel</button>
</div>
</form>
</div>
</div>

<script>
function openEdit(btn){
document.getElementById('editId').value=btn.getAttribute('data-id');
document.getElementById('editName').value=btn.getAttribute('data-name');
document.getElementById('editEmail').value=btn.getAttribute('data-email');
document.getElementById('editRole').value=btn.getAttribute('data-role');
document.getElementById('editModal').style.display='flex';
}
</script>

</body>
</html>
