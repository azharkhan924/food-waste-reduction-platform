<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verify OTP — FoodRescue</title>
  <link rel="stylesheet" th:href="@{/css/auth.css}">
  <link rel="icon" type="image/png" th:href="@{/images/logo.png}">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="auth-body">

  <!-- Navbar -->
  <nav class="auth-nav">
    <div class="auth-nav-inner">
      <a th:href="@{/}" class="auth-nav-logo">
        <img th:src="@{/images/logo.png}" alt="FoodRescue">
      </a>
      <ul class="auth-nav-links">
        <li><a th:href="@{/login}">Login</a></li>
        <li><a th:href="@{/register}" class="nav-btn">Register →</a></li>
      </ul>
    </div>
  </nav>

  <!-- Auth Content -->
  <main class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-card-header">
        <div class="auth-card-icon">
          <i data-lucide="shield-check"></i>
        </div>
        <h1>Verify OTP</h1>
        <p>Enter the 6-digit code sent to your email</p>
      </div>

      <!-- Success Message -->
      <div th:if="${success}" class="auth-message success">
        <i data-lucide="circle-check"></i>
        <span th:text="${success}"></span>
      </div>

      <!-- Error Message -->
      <div th:if="${error}" class="auth-message error">
        <i data-lucide="alert-circle"></i>
        <span th:text="${error}"></span>
      </div>

      <form th:action="@{/verify-otp}" method="post" class="auth-form">
        <input type="hidden" name="email" th:value="${email}">

        <div class="form-group">
          <label class="form-label">One-Time Password</label>
          <div class="form-input-wrap">
            <input type="text" name="otp" class="form-input" placeholder="Enter 6-digit OTP" required id="verify-otp-input">
            <span class="form-input-icon"><i data-lucide="hash"></i></span>
          </div>
        </div>

        <button type="submit" class="auth-btn" id="verify-otp-btn">
          <i data-lucide="shield-check"></i>
          Verify OTP
        </button>
      </form>

      <div class="auth-card-footer">
        Didn't receive the code?
        <a th:href="@{/forgot-password}">Resend OTP</a>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="auth-page-footer">
    &copy; 2026 FoodRescue. All rights reserved.
  </footer>

  <script>lucide.createIcons();</script>
</body>
</html>
