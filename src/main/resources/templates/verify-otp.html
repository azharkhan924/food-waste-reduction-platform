<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verify OTP</title>
<link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div id="mymenu">
		<ul>
			<li><a th:href="@{/login}">Home</a></li>
			<li><a th:href="@{/login}">Login</a></li>
			<li><a th:href="@{/register}">Register</a></li>
			<li>About us</li>
			<li>Contact us</li>
		</ul>
	</div>

<div class="card">

<h1>Food Waste Platform</h1>
<h2>Verify OTP</h2>

<p th:if="${success}" th:text="${success}" style="color:#66bb6a;"></p>
<p th:if="${error}" th:text="${error}" style="color:#ef5350;"></p>

<form th:action="@{/verify-otp}" method="post">

<input type="hidden" name="email" th:value="${email}">

<label>Enter OTP</label>
<input type="text" name="otp" placeholder="Enter 6-digit OTP" required>

<button type="submit" class="b1">Verify OTP</button>

</form>

<p>
Didn't receive OTP?
<a th:href="@{/forgot-password}">Resend OTP</a>
</p>

</div>

</body>
</html>
