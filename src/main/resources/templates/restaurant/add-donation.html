<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add Donation — FoodRescue Restaurant</title>
  <link rel="stylesheet" th:href="@{/css/dashboard.css}">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="icon" type="image/png" th:href="@{/images/logo.png}">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body class="dash-body role-restaurant">

  <!-- Sidebar Overlay (mobile) -->
  <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>

  <!-- Sidebar -->
  <aside class="dash-sidebar" id="sidebar">
    <div class="sidebar-header">
      <a th:href="@{/}" class="sidebar-logo">
        <img th:src="@{/images/logo.png}" alt="FoodRescue">
      </a>
      <button class="sidebar-toggle-btn" onclick="toggleSidebarFold()" title="Fold Sidebar">
        <i data-lucide="panel-left-close"></i>
      </button>
    </div>
    <div class="sidebar-label">Main Menu</div>
    <nav class="sidebar-nav">
      <a th:href="@{/restaurant/dashboard}" class="sidebar-link" title="Active Donations">
        <i data-lucide="bookmark"></i>
        <span class="sidebar-link-text">Active Donations</span>
      </a>
      <a th:href="@{/restaurant/add-donation}" class="sidebar-link active" title="Add Donation">
        <i data-lucide="plus-circle"></i>
        <span class="sidebar-link-text">Add Donation</span>
      </a>
      <a th:href="@{/restaurant/history}" class="sidebar-link" title="History">
        <i data-lucide="clock"></i>
        <span class="sidebar-link-text">History</span>
      </a>
    </nav>
    <div class="sidebar-footer">
      <a th:href="@{/logout}" class="sidebar-logout" title="Sign Out">
        <i data-lucide="log-out"></i>
        <span class="sidebar-link-text">Sign Out</span>
      </a>
    </div>
  </aside>

  <!-- Main Content -->
  <main class="dash-main">
    <!-- Top Bar -->
    <header class="dash-topbar">
      <button class="topbar-hamburger" onclick="toggleSidebar()"><i data-lucide="menu"></i></button>

      <div class="topbar-title" style="font-size:16px; font-weight:700; color:#111827; display:flex; align-items:center; gap:8px;">
        <i data-lucide="plus-circle" style="color:#059669;"></i> Add Donation
      </div>

      <!-- Right profile pill -->
      <div class="malinessa-top-right">
        <div class="malinessa-profile-pill">
          <div class="malinessa-avatar" th:text="${name != null ? name.substring(0,1).toUpperCase() : 'R'}">R</div>
          <div class="malinessa-profile-name">
            <span th:text="${name}">Restaurant</span>
          </div>
        </div>
      </div>
    </header>

    <div class="dash-content">
      <!-- Page Head -->
      <div class="malinessa-page-head">
        <h1 class="malinessa-page-title">Add Surplus Food Donation</h1>
      </div>

      <!-- Interactive Quick Food Category Tabs -->
      <div class="malinessa-tabs">
        <div class="malinessa-tab active" onclick="selectCategory(this, '')">All Types</div>
        <div class="malinessa-tab" onclick="selectCategory(this, 'Main Course - ')">Main Courses</div>
        <div class="malinessa-tab" onclick="selectCategory(this, 'Bakery - ')">Bakery &amp; Bread</div>
        <div class="malinessa-tab" onclick="selectCategory(this, 'Soups/Dal - ')">Soups &amp; Dal</div>
        <div class="malinessa-tab" onclick="selectCategory(this, 'Packaged - ')">Packaged Meals</div>
        <div class="malinessa-tab" onclick="selectCategory(this, 'Beverages - ')">Beverages</div>
      </div>

      <!-- Form Card -->
      <div class="malinessa-card" style="max-width: 680px; min-height: auto;">
        <form th:action="@{/restaurant/add-donation}" method="post">
          <div class="form-group" style="margin-bottom: 20px;">
            <label class="dash-label">Food Name / Description</label>
            <input type="text" name="foodName" id="foodNameInput" class="dash-input" placeholder="e.g. Scrambled egg toast, Dal Rice Combo" required style="width:100%;">
          </div>

          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 20px;">
            <div class="form-group">
              <label class="dash-label">Quantity (Servings)</label>
              <input type="number" min="1" name="qty" class="dash-input" placeholder="e.g. 50" required style="width:100%;">
            </div>

            <div class="form-group">
              <label class="dash-label">Expiry Date</label>
              <input type="date" name="expiry" class="dash-input" required style="width:100%;">
            </div>
          </div>

          <div class="form-group" style="margin-bottom: 20px;">
            <label class="dash-label">Pickup Address</label>
            <input type="text" name="pickupAddress" id="addressInput" class="dash-input" placeholder="Enter pickup location or click on map below" required style="width:100%;">
          </div>

          <input type="hidden" name="latitude" id="latField">
          <input type="hidden" name="longitude" id="lngField">

          <div class="form-group" style="margin-bottom: 20px;">
            <label class="dash-label">Select Location on Map</label>
            <p style="font-size:12px; color:#6B7280; margin-bottom:10px;">Click on the map to pin your exact pickup location</p>
            <div id="map" class="map-container" style="height:260px; border-radius:12px;"></div>
          </div>

          <p id="coordsDisplay" style="font-size:12px; color:#059669; font-weight:600; margin:10px 0;"></p>

          <button type="submit" class="btn-mcard-confirm" style="width:100%; justify-content:center; padding:12px 24px; font-size:15px; margin-top:8px;">
            <i data-lucide="plus-circle" style="width:18px; height:18px;"></i> Add Donation
          </button>
        </form>
      </div>
    </div>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    lucide.createIcons();

    function toggleSidebar() {
      document.getElementById('sidebar').classList.toggle('open');
      document.getElementById('sidebarOverlay').classList.toggle('open');
    }

    function toggleSidebarFold() {
      document.body.classList.toggle('sidebar-folded');
      const isFolded = document.body.classList.contains('sidebar-folded');
      localStorage.setItem('foodrescue_sidebar_folded', isFolded ? 'true' : 'false');
    }

    (function() {
      if (localStorage.getItem('foodrescue_sidebar_folded') === 'true') {
        document.body.classList.add('sidebar-folded');
      }
    })();

    function selectCategory(tabEl, prefix) {
      document.querySelectorAll('.malinessa-tab').forEach(t => t.classList.remove('active'));
      tabEl.classList.add('active');

      const input = document.getElementById('foodNameInput');
      if (prefix) {
        if (!input.value.startsWith(prefix)) {
          input.value = prefix + input.value.replace(/^(Main Course - |Bakery - |Soups\/Dal - |Packaged - |Beverages - )/, '');
        }
      } else {
        input.value = input.value.replace(/^(Main Course - |Bakery - |Soups\/Dal - |Packaged - |Beverages - )/, '');
      }
      input.focus();
    }

    var map = L.map('map').setView([20.5937, 78.9629], 5);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '© OpenStreetMap'
    }).addTo(map);

    var marker = null;

    map.on('click', function (e) {
      var lat = e.latlng.lat;
      var lng = e.latlng.lng;

      document.getElementById('latField').value = lat;
      document.getElementById('lngField').value = lng;
      document.getElementById('coordsDisplay').innerHTML = '📍 Lat: ' + lat.toFixed(4) + ', Lng: ' + lng.toFixed(4);

      if (marker != null) {
        map.removeLayer(marker);
      }
      marker = L.marker([lat, lng]).addTo(map);

      fetch('https://nominatim.openstreetmap.org/reverse?format=json&lat=' + lat + '&lon=' + lng)
        .then(function (response) { return response.json(); })
        .then(function (data) {
          if (data.display_name) {
            document.getElementById('addressInput').value = data.display_name;
          }
        })
        .catch(function (err) {
          console.log(err);
        });
    });

    if (navigator.geolocation) {
      navigator.geolocation.getCurrentPosition(function (pos) {
        map.setView([pos.coords.latitude, pos.coords.longitude], 14);
      });
    }
  </script>
</body>

</html>
