<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Active Donations — FoodRescue Restaurant</title>
  <link rel="stylesheet" th:href="@{/css/dashboard.css}">
  <link rel="icon" type="image/png" th:href="@{/images/logo.png}">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body class="dash-body role-restaurant">

  <!-- Sidebar Overlay (mobile) -->
  <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>

  <!-- Sidebar -->
  <aside class="dash-sidebar" id="sidebar">
    <div class="sidebar-header">
      <a th:href="@{/}" class="sidebar-logo">
        <img th:src="@{/images/logo.png}" alt="FoodRescue">
      </a>
      <button class="sidebar-toggle-btn" onclick="toggleSidebarFold()" title="Fold Sidebar">
        <i data-lucide="panel-left-close" id="foldIcon"></i>
      </button>
    </div>
    <div class="sidebar-label">Main Menu</div>
    <nav class="sidebar-nav">
      <a th:href="@{/restaurant/dashboard}" class="sidebar-link active" title="Active Donations">
        <i data-lucide="bookmark"></i>
        <span class="sidebar-link-text">Active Donations</span>
      </a>
      <a th:href="@{/restaurant/add-donation}" class="sidebar-link" title="Add Donation">
        <i data-lucide="plus-circle"></i>
        <span class="sidebar-link-text">Add Donation</span>
      </a>
      <a th:href="@{/restaurant/history}" class="sidebar-link" title="History">
        <i data-lucide="clock"></i>
        <span class="sidebar-link-text">History</span>
      </a>
    </nav>
    <div class="sidebar-footer">
      <a th:href="@{/logout}" class="sidebar-logout" title="Sign Out">
        <i data-lucide="log-out"></i>
        <span class="sidebar-link-text">Sign Out</span>
      </a>
    </div>
  </aside>

  <!-- Main Content -->
  <main class="dash-main">
    <!-- Top Bar -->
    <header class="dash-topbar">
      <button class="topbar-hamburger" onclick="toggleSidebar()"><i data-lucide="menu"></i></button>

      <!-- Live Search Input -->
      <div class="malinessa-search-wrap">
        <i data-lucide="search" class="malinessa-search-icon"></i>
        <input type="text" id="searchInput" onkeyup="filterDonations()" class="malinessa-search-input" placeholder="Search active donations...">
      </div>

      <!-- Right Profile Pill -->
      <div class="malinessa-top-right">
        <div class="malinessa-profile-pill">
          <div class="malinessa-avatar" th:text="${name != null ? name.substring(0,1).toUpperCase() : 'R'}">R</div>
          <div class="malinessa-profile-name">
            <span th:text="${name}">Restaurant</span>
          </div>
        </div>
      </div>
    </header>

    <div class="dash-content">
      <!-- Page Head -->
      <div class="malinessa-page-head">
        <h1 class="malinessa-page-title">Active Donations</h1>
        <a th:href="@{/restaurant/add-donation}" class="btn-mcard-confirm" style="flex: initial; padding: 8px 18px;">
          <i data-lucide="plus" style="width:16px; height:16px;"></i> Add Donation
        </a>
      </div>

      <!-- Donation Grid -->
      <div class="malinessa-grid" id="donationGrid">

        <!-- Card 0: Dashed Add Donation Card -->
        <a th:href="@{/restaurant/add-donation}" class="malinessa-create-card">
          <div class="create-bell-icon">
            <div class="create-bell-inner">
              <i data-lucide="utensils"></i>
            </div>
          </div>
          <div class="create-card-btn">
            Add Donation +
          </div>
        </a>

        <!-- ONLY Pending Donations in Active Grid -->
        <div th:each="d : ${donations}" th:if="${d.status == 'Pending'}" class="malinessa-card donation-card-item">
          <div class="mcard-header">
            <span class="mcard-status-incoming">
              <i data-lucide="clock" style="width:12px; height:12px; margin-right:4px;"></i> Pending Pickup
            </span>
          </div>

          <div class="mcard-body">
            <div class="mcard-left">
              <div class="mcard-avatar" th:text="${d.foodName != null ? d.foodName.substring(0,1).toUpperCase() : 'F'}">F</div>
              <div class="mcard-title card-food-name" th:text="${d.foodName}">Food Item</div>
              <div class="mcard-detail-line card-address">
                <i data-lucide="map-pin"></i>
                <span th:text="${d.pickupAddress}">Address</span>
              </div>
            </div>

            <div class="mcard-right-diagram">
              <div class="table-graphic graphic-pending">
                <i data-lucide="clock"></i>
              </div>

              <div class="mcard-servings">
                <i data-lucide="users" style="width:12px; height:12px; color:#059669;"></i>
                <span th:text="${d.qty} + ' servings'">40 servings</span>
              </div>
              <div class="mcard-time" th:if="${d.expiry != null}">
                <i data-lucide="calendar" style="width:12px; height:12px;"></i>
                <span th:text="${#temporals.format(d.expiry, 'dd MMM yyyy')}">Date</span>
              </div>
            </div>
          </div>

          <div class="mcard-footer">
            <a th:href="@{/restaurant/delete/{id}(id=${d.id})}" onclick="return confirm('Are you sure you want to cancel and delete this donation?')" class="btn-mcard-cancel" style="width: 100%; color: #EF4444; background: #FEF2F2; border: 1px solid #FECACA;">
              <i data-lucide="trash-2" style="width:14px; height:14px;"></i> Delete Donation
            </a>
          </div>
        </div>

      </div>
    </div>
  </main>

  <script>
    lucide.createIcons();

    function toggleSidebar() {
      document.getElementById('sidebar').classList.toggle('open');
      document.getElementById('sidebarOverlay').classList.toggle('open');
    }

    function toggleSidebarFold() {
      document.body.classList.toggle('sidebar-folded');
      const isFolded = document.body.classList.contains('sidebar-folded');
      localStorage.setItem('foodrescue_sidebar_folded', isFolded ? 'true' : 'false');
    }

    (function() {
      if (localStorage.getItem('foodrescue_sidebar_folded') === 'true') {
        document.body.classList.add('sidebar-folded');
      }
    })();

    function filterDonations() {
      const query = document.getElementById('searchInput').value.toLowerCase().trim();
      const cards = document.querySelectorAll('.donation-card-item');

      cards.forEach(card => {
        const foodName = card.querySelector('.card-food-name')?.innerText.toLowerCase() || '';
        const address = card.querySelector('.card-address')?.innerText.toLowerCase() || '';

        if (foodName.includes(query) || address.includes(query)) {
          card.style.display = 'flex';
        } else {
          card.style.display = 'none';
        }
      });
    }
  </script>
</body>

</html>
