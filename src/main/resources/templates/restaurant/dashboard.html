<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Restaurant Dashboard</title>
<link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div id="mymenu">
		<ul>
			<li><a th:href="@{/restaurant/dashboard}">Dashboard</a></li>
			<li><a th:href="@{/restaurant/add-donation}">Add Donation</a></li>
			<li><a th:href="@{/restaurant/history}">History</a></li>
			<li><a th:href="@{/logout}">Logout</a></li>
		</ul>
	</div>

<div class="main-box">

<h1>Welcome, <span th:text="${name}">Restaurant</span> 👋</h1>

<div class="info-row">
<div class="info-card">
<h3 th:text="${totalDonations}">0</h3>
<p>Total Donations</p>
</div>
<div class="info-card">
<h3 th:text="${totalMeals}">0</h3>
<p>Meals Donated</p>
</div>
</div>

<div class="content-area">

<h2>Your Active Donations</h2>

<a th:href="@{/restaurant/add-donation}" class="add-btn">+ Add New Donation</a>

<div th:if="${#lists.isEmpty(donations)}">
<p class="no-data">No donations yet. Start by adding one!</p>
</div>

<table class="mytable" th:if="${!#lists.isEmpty(donations)}">
<thead>
<tr>
<th>Food Item</th>
<th>Qty</th>
<th>Expiry</th>
<th>Pickup Address</th>
<th>Status</th>
<th>Action</th>
</tr>
</thead>
<tbody>
<tr th:each="d : ${donations}">
<td th:text="${d.foodName}"></td>
<td th:text="${d.qty}"></td>
<td th:text="${d.expiry}"></td>
<td th:text="${d.pickupAddress}"></td>
<td>
<span class="st-pending" th:if="${d.status == 'Pending'}">Pending</span>
<span class="st-accepted" th:if="${d.status == 'Accepted'}">Accepted</span>
<span class="st-picked" th:if="${d.status == 'Picked Up'}">Picked Up</span>
</td>
<td>
<a th:href="@{/restaurant/delete/{id}(id=${d.id})}" th:if="${d.status == 'Pending'}" onclick="return confirm('Are you sure?')">
<button class="del-btn">Delete</button>
</a>
</td>
</tr>
</tbody>
</table>

</div>

</div>

</body>
</html>
