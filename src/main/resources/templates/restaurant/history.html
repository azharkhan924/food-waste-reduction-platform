<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Donation History</title>
<link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div id="mymenu">
		<ul>
			<li><a th:href="@{/restaurant/dashboard}">Dashboard</a></li>
			<li><a th:href="@{/restaurant/add-donation}">Add Donation</a></li>
			<li><a th:href="@{/restaurant/history}">History</a></li>
			<li><a th:href="@{/logout}">Logout</a></li>
		</ul>
	</div>

<div class="dashboard-container">

<h1>Donation History</h1>

<div th:if="${#lists.isEmpty(donations)}">
<p style="color:#aaa;">No donations found.</p>
</div>

<table class="data-table" th:if="${!#lists.isEmpty(donations)}">
<tr>
<th>Food Item</th>
<th>Qty</th>
<th>Expiry</th>
<th>Pickup Address</th>
<th>Status</th>
<th>Accepted By</th>
<th>Date Added</th>
</tr>
<tr th:each="d : ${donations}">
<td th:text="${d.foodName}"></td>
<td th:text="${d.qty}"></td>
<td th:text="${d.expiry}"></td>
<td th:text="${d.pickupAddress}"></td>
<td>
<span class="status-pending" th:if="${d.status == 'Pending'}">Pending</span>
<span class="status-accepted" th:if="${d.status == 'Accepted'}">Accepted</span>
<span class="status-picked" th:if="${d.status == 'Picked Up'}">Picked Up</span>
</td>
<td th:text="${d.ngoName != null ? d.ngoName : '-'}"></td>
<td th:text="${d.createdAt}"></td>
</tr>
</table>

<p style="margin-top:20px;">
<a th:href="@{/restaurant/dashboard}">Back to Dashboard</a>
</p>

</div>

</body>
</html>
