<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Donation History — FoodRescue Restaurant</title>
  <link rel="stylesheet" th:href="@{/css/dashboard.css}">
  <link rel="icon" type="image/png" th:href="@{/images/logo.png}">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body class="dash-body role-restaurant">

  <th:block th:replace="~{fragments/sidebar-restaurant :: sidebar(activePage='history')}"></th:block>

  <!-- Main Content -->
  <main class="dash-main">
    <header th:replace="~{fragments/topbar :: topbar(searchPlaceholder='Search history...', searchFunction='filterHistory', name=${name}, defaultInitial='R')}"></header>

    <div class="dash-content">
      <!-- Page Head -->
      <div class="malinessa-page-head">
        <h1 class="malinessa-page-title">Donation History</h1>
      </div>

      <!-- History Grid Cards -->
      <div class="malinessa-grid" id="historyGrid">
        <div th:each="d : ${donations}" th:if="${d.status == 'Picked Up' or d.status == 'Accepted'}" class="malinessa-card history-card-item">
          <div class="mcard-header">
            <span class="mcard-status-confirmed" th:if="${d.status == 'Accepted'}">
              <i data-lucide="heart-handshake" style="width:12px; height:12px; margin-right:4px;"></i> Accepted by NGO
            </span>
            <span class="mcard-status-completed" th:if="${d.status == 'Picked Up'}">
              <i data-lucide="package-check" style="width:12px; height:12px; margin-right:4px;"></i> Picked Up / Completed
            </span>
          </div>

          <div class="mcard-body">
            <div class="mcard-left">
              <div class="mcard-avatar" th:text="${d.foodName != null ? d.foodName.substring(0,1).toUpperCase() : 'F'}">F</div>
              <div class="mcard-title card-food-name" th:text="${d.foodName}">Food Item</div>
              <div class="mcard-detail-line card-address">
                <i data-lucide="map-pin"></i>
                <span th:text="${d.pickupAddress}">Address</span>
              </div>
              <div class="mcard-detail-line" th:if="${d.ngoName != null}">
                <i data-lucide="heart-handshake"></i>
                <span th:text="'NGO: ' + ${d.ngoName}">NGO</span>
              </div>
            </div>

            <div class="mcard-right-diagram">
              <div class="table-graphic graphic-accepted" th:if="${d.status == 'Accepted'}">
                <i data-lucide="heart-handshake"></i>
              </div>
              <div class="table-graphic graphic-picked" th:if="${d.status == 'Picked Up'}">
                <i data-lucide="package-check"></i>
              </div>

              <div class="mcard-servings">
                <i data-lucide="users" style="width:12px; height:12px; color:#059669;"></i>
                <span th:text="${d.qty} + ' servings'">40 servings</span>
              </div>
              <div class="mcard-time" th:if="${d.createdAt != null}">
                <i data-lucide="calendar" style="width:12px; height:12px;"></i>
                <span th:text="${#temporals.format(d.createdAt, 'dd MMM yyyy')}">Date</span>
              </div>
            </div>
          </div>

          <div class="mcard-footer">
            <span class="btn-mcard-confirm" style="background:#F8FAFC; color:#475569; border:1px solid #E2E8F0; cursor:default; width:100%;">
              <i data-lucide="package-check" style="width:14px; height:14px; color:#059669;" th:if="${d.status == 'Picked Up'}"></i>
              <i data-lucide="heart-handshake" style="width:14px; height:14px; color:#059669;" th:if="${d.status == 'Accepted'}"></i>
              <span th:text="${d.status == 'Picked Up' ? 'Picked Up / Completed' : 'Accepted by NGO'}">Completed</span>
            </span>
          </div>
        </div>
      </div>

      <div th:if="${#lists.isEmpty(donations)}" class="malinessa-card" style="margin-top:20px; text-align:center; padding:48px 24px;">
        <div style="width:56px; height:56px; background:#ECFDF5; border-radius:50%; display:flex; align-items:center; justify-content:center; margin:0 auto 16px; color:#059669;">
          <i data-lucide="inbox" style="width:28px; height:28px;"></i>
        </div>
        <h3 style="font-size:16px; font-weight:700; color:#111827; margin-bottom:6px;">No donation history yet</h3>
        <p style="font-size:14px; color:#6B7280;">Accepted and picked up donation records will appear here.</p>
      </div>

    </div>
  </main>

  <th:block th:replace="~{fragments/sidebar-scripts :: scripts}"></th:block>
  <script>

    function filterHistory() {
      const query = document.getElementById('searchInput').value.toLowerCase().trim();
      const cards = document.querySelectorAll('.history-card-item');

      cards.forEach(card => {
        const foodName = card.querySelector('.card-food-name')?.innerText.toLowerCase() || '';
        const address = card.querySelector('.card-address')?.innerText.toLowerCase() || '';

        if (foodName.includes(query) || address.includes(query)) {
          card.style.display = 'flex';
        } else {
          card.style.display = 'none';
        }
      });
    }
  </script>
</body>

</html>
