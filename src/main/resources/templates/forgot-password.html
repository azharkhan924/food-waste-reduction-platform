<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password — FoodRescue</title>
  <link rel="stylesheet" th:href="@{/css/auth.css}">
  <link rel="icon" type="image/png" th:href="@{/images/logo.png}">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="auth-body">

  <!-- Navbar -->
  <nav class="auth-nav">
    <div class="auth-nav-inner">
      <a th:href="@{/}" class="auth-nav-logo">
        <img th:src="@{/images/logo.png}" alt="FoodRescue">
      </a>
      <ul class="auth-nav-links">
        <li><a th:href="@{/login}">Login</a></li>
        <li><a th:href="@{/register}" class="nav-btn">Register →</a></li>
      </ul>
    </div>
  </nav>

  <!-- Auth Content -->
  <main class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-card-header">
        <div class="auth-card-icon">
          <i data-lucide="key-round"></i>
        </div>
        <h1>Forgot Password</h1>
        <p>Enter your email and we'll send you a one-time password</p>
      </div>

      <!-- Error Message -->
      <div th:if="${error}" class="auth-message error">
        <i data-lucide="alert-circle"></i>
        <span th:text="${error}"></span>
      </div>

      <form th:action="@{/forgot-password}" method="post" class="auth-form">
        <div class="form-group">
          <label class="form-label">Email Address</label>
          <div class="form-input-wrap">
            <input type="email" name="email" class="form-input" placeholder="Enter your registered email" required id="forgot-email">
            <span class="form-input-icon"><i data-lucide="mail"></i></span>
          </div>
        </div>

        <button type="submit" class="auth-btn" id="forgot-submit-btn">
          <i data-lucide="send"></i>
          Send OTP
        </button>
      </form>

      <div class="auth-card-footer">
        <a th:href="@{/login}" class="back-link">
          <i data-lucide="arrow-left"></i>
          Back to Login
        </a>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="auth-page-footer">
    &copy; 2026 FoodRescue. All rights reserved.
  </footer>

  <script>lucide.createIcons();</script>
</body>
</html>
