<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Pickups — FoodRescue NGO</title>
  <link rel="stylesheet" th:href="@{/css/dashboard.css}">
  <link rel="icon" type="image/png" th:href="@{/images/logo.png}">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body class="dash-body role-ngo">

  <th:block th:replace="~{fragments/sidebar-ngo :: sidebar(activePage='history')}"></th:block>

  <!-- Main Content -->
  <main class="dash-main">
    <header th:replace="~{fragments/topbar :: topbar(searchPlaceholder='Search my pickups...', searchFunction='filterPickups', name=${name}, defaultInitial='N')}"></header>

    <div class="dash-content">
      <!-- Page Head -->
      <div class="malinessa-page-head">
        <h1 class="malinessa-page-title">My Claimed Pickups</h1>
      </div>

      <!-- KPI Cards -->
      <div class="kpi-grid" style="margin-bottom:24px;">
        <div class="kpi-card">
          <div class="kpi-icon green"><i data-lucide="package-check"></i></div>
          <div class="kpi-info">
            <div class="kpi-value" th:text="${totalAccepted}">0</div>
            <div class="kpi-label">Total Accepted</div>
          </div>
        </div>
        <div class="kpi-card">
          <div class="kpi-icon amber"><i data-lucide="utensils"></i></div>
          <div class="kpi-info">
            <div class="kpi-value" th:text="${totalMeals}">0</div>
            <div class="kpi-label">Meals Received</div>
          </div>
        </div>
      </div>

      <!-- NGO History Cards Grid -->
      <div class="malinessa-grid" id="historyGrid">
        <div th:each="d : ${donations}" class="malinessa-card pickup-card-item">
          <div class="mcard-header">
            <span class="mcard-status-confirmed" th:if="${d.status == 'Accepted'}" style="background:#ECFDF5; color:#059669; border-color:#A7F3D0;">
              <i data-lucide="clock" style="width:12px; height:12px; margin-right:4px;"></i> Ready for Pickup
            </span>
            <span class="mcard-status-completed" th:if="${d.status == 'Picked Up'}">
              <i data-lucide="package-check" style="width:12px; height:12px; margin-right:4px;"></i> Picked Up
            </span>
          </div>

          <div class="mcard-body">
            <div class="mcard-left">
              <div class="mcard-avatar" style="background:#ECFDF5; color:#059669;" th:text="${d.foodName != null ? d.foodName.substring(0,1).toUpperCase() : 'F'}">F</div>
              <div class="mcard-title card-food-name" th:text="${d.foodName}">Food Item</div>
              <div class="mcard-detail-line card-donor">
                <i data-lucide="store" style="color:#059669;"></i>
                <span th:text="'Donor: ' + ${d.restaurantName}">Restaurant</span>
              </div>
              <div class="mcard-detail-line card-address">
                <i data-lucide="map-pin"></i>
                <span th:text="${d.pickupAddress}">Address</span>
              </div>
            </div>

            <div class="mcard-right-diagram">
              <div class="table-graphic" style="border-color:#059669; background:#ECFDF5; color:#059669;">
                <i data-lucide="truck"></i>
              </div>
              <div class="mcard-servings">
                <i data-lucide="users" style="width:12px; height:12px; color:#059669;"></i>
                <span th:text="${d.qty} + ' servings'">40 servings</span>
              </div>
              <div class="mcard-time" th:if="${d.expiry != null}">
                <i data-lucide="calendar" style="width:12px; height:12px;"></i>
                <span th:text="${#temporals.format(d.expiry, 'dd MMM yyyy')}">Expiry</span>
              </div>
            </div>
          </div>

          <div class="mcard-footer">
            <th:block th:if="${d.status == 'Accepted'}">
              <a th:href="@{/ngo/pickup/{id}(id=${d.id})}" onclick="return confirm('Mark this donation as picked up?')" class="btn-mcard-confirm" style="background:#059669; width:100%;">
                <i data-lucide="truck" style="width:16px; height:16px;"></i> Mark Picked Up
              </a>
            </th:block>

            <th:block th:if="${d.status == 'Picked Up'}">
              <span class="btn-mcard-confirm" style="background:#EFF6FF; color:#2563EB; border:1px solid #BFDBFE; cursor:default; width:100%;">
                <i data-lucide="check-check" style="width:14px; height:14px;"></i> Completed ✓
              </span>
            </th:block>
          </div>
        </div>
      </div>

      <div th:if="${#lists.isEmpty(donations)}" class="malinessa-card" style="margin-top:20px; text-align:center; padding:48px 24px;">
        <div style="width:56px; height:56px; background:#ECFDF5; border-radius:50%; display:flex; align-items:center; justify-content:center; margin:0 auto 16px; color:#059669;">
          <i data-lucide="inbox" style="width:28px; height:28px;"></i>
        </div>
        <h3 style="font-size:16px; font-weight:700; color:#111827; margin-bottom:6px;">No accepted pickups yet</h3>
        <p style="font-size:14px; color:#6B7280;">Browse available food donations on the dashboard to accept pickups.</p>
      </div>

    </div>
  </main>

  <th:block th:replace="~{fragments/sidebar-scripts :: scripts}"></th:block>
  <script>

    function filterPickups() {
      const query = document.getElementById('searchInput').value.toLowerCase().trim();
      const cards = document.querySelectorAll('.pickup-card-item');

      cards.forEach(card => {
        const foodName = card.querySelector('.card-food-name')?.innerText.toLowerCase() || '';
        const donor = card.querySelector('.card-donor')?.innerText.toLowerCase() || '';
        const address = card.querySelector('.card-address')?.innerText.toLowerCase() || '';

        if (foodName.includes(query) || donor.includes(query) || address.includes(query)) {
          card.style.display = 'flex';
        } else {
          card.style.display = 'none';
        }
      });
    }
  </script>
</body>

</html>
