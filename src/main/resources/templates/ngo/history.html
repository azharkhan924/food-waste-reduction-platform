<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Donations</title>
<link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div id="mymenu">
		<ul>
			<li><a th:href="@{/ngo/dashboard}">Dashboard</a></li>
			<li><a th:href="@{/ngo/history}">My Donations</a></li>
			<li><a th:href="@{/logout}">Logout</a></li>
		</ul>
	</div>

<div class="dashboard-container">

<h1>My Accepted Donations</h1>

<div class="stats-row">
<div class="stat-box">
<h3 th:text="${totalAccepted}">0</h3>
<p>Total Accepted</p>
</div>
<div class="stat-box">
<h3 th:text="${totalMeals}">0</h3>
<p>Meals Received</p>
</div>
</div>

<div th:if="${#lists.isEmpty(donations)}">
<p style="color:#aaa;">You haven't accepted any donations yet.</p>
</div>

<table class="data-table" th:if="${!#lists.isEmpty(donations)}">
<tr>
<th>Food Item</th>
<th>Qty</th>
<th>Expiry</th>
<th>Pickup Address</th>
<th>Donated By</th>
<th>Status</th>
<th>Action</th>
</tr>
<tr th:each="d : ${donations}">
<td th:text="${d.foodName}"></td>
<td th:text="${d.qty}"></td>
<td th:text="${d.expiry}"></td>
<td th:text="${d.pickupAddress}"></td>
<td th:text="${d.restaurantName}"></td>
<td>
<span class="status-accepted" th:if="${d.status == 'Accepted'}">Accepted</span>
<span class="status-picked" th:if="${d.status == 'Picked Up'}">Picked Up</span>
</td>
<td>
<a th:href="@{/ngo/pickup/{id}(id=${d.id})}" th:if="${d.status == 'Accepted'}" onclick="return confirm('Mark as picked up?')">
<button class="btn-pickup">Mark Picked Up</button>
</a>
<span th:if="${d.status == 'Picked Up'}" style="color:#4caf50;">Done ✓</span>
</td>
</tr>
</table>

<p style="margin-top:20px;">
<a th:href="@{/ngo/dashboard}">Back to Dashboard</a>
</p>

</div>

</body>
</html>
