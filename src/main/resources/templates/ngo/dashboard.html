<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Available Food — FoodRescue NGO</title>
  <link rel="stylesheet" th:href="@{/css/dashboard.css}">
  <link rel="icon" type="image/png" th:href="@{/images/logo.png}">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body class="dash-body role-ngo">

  <th:block th:replace="~{fragments/sidebar-ngo :: sidebar(activePage='dashboard')}"></th:block>

  <!-- Main Content -->
  <main class="dash-main">
    <header th:replace="~{fragments/topbar :: topbar(searchPlaceholder='Search available food...', searchFunction='filterDonations', name=${name}, defaultInitial='N')}"></header>

    <div class="dash-content">
      <!-- Page Head -->
      <div class="malinessa-page-head">
        <h1 class="malinessa-page-title">Available Food Donations</h1>
        <a th:href="@{/ngo/map}" class="btn-mcard-confirm" style="background:#059669; flex: initial; padding: 8px 18px;">
          <i data-lucide="map" style="width:16px; height:16px;"></i> Map View
        </a>
      </div>

      <!-- NGO Cards Grid -->
      <div class="malinessa-grid" id="donationGrid">

        <!-- Available Donation Cards -->
        <div th:each="d : ${donations}" class="malinessa-card ngo-card-item">
          <div class="mcard-header">
            <span class="mcard-status-incoming" style="background:#ECFDF5; color:#059669; border-color:#A7F3D0;">
              <i data-lucide="clock" style="width:12px; height:12px; margin-right:4px;"></i> Available Now
            </span>
          </div>

          <div class="mcard-body">
            <div class="mcard-left">
              <div class="mcard-avatar" style="background:#ECFDF5; color:#059669;" th:text="${d.foodName != null ? d.foodName.substring(0,1).toUpperCase() : 'F'}">F</div>
              <div class="mcard-title card-food-name" th:text="${d.foodName}">Food Item</div>
              <div class="mcard-detail-line card-donor">
                <i data-lucide="store" style="color:#059669;"></i>
                <span th:text="'By ' + ${d.restaurantName}">Restaurant</span>
              </div>
              <div class="mcard-detail-line card-address">
                <i data-lucide="map-pin"></i>
                <span th:text="${d.pickupAddress}">Address</span>
              </div>
            </div>

            <div class="mcard-right-diagram">
              <div class="table-graphic" style="border-color:#059669; background:#ECFDF5; color:#059669;">
                <i data-lucide="utensils-crossed"></i>
              </div>
              <div class="mcard-servings">
                <i data-lucide="users" style="width:12px; height:12px; color:#059669;"></i>
                <span th:text="${d.qty} + ' servings'">40 servings</span>
              </div>
              <div class="mcard-time" th:if="${d.expiry != null}">
                <i data-lucide="calendar" style="width:12px; height:12px;"></i>
                <span th:text="${#temporals.format(d.expiry, 'dd MMM yyyy')}">Date</span>
              </div>
            </div>
          </div>

          <div class="mcard-footer">
            <a th:href="@{/ngo/accept/{id}(id=${d.id})}" onclick="return confirm('Accept and claim this food donation?')" class="btn-mcard-confirm" style="background:#059669; width:100%;">
              <i data-lucide="check-circle" style="width:16px; height:16px;"></i> Accept Donation
            </a>
          </div>
        </div>

      </div>

      <div th:if="${#lists.isEmpty(donations)}" class="malinessa-card" style="margin-top:20px; text-align:center; padding:48px 24px;">
        <div style="width:56px; height:56px; background:#ECFDF5; border-radius:50%; display:flex; align-items:center; justify-content:center; margin:0 auto 16px; color:#059669;">
          <i data-lucide="inbox" style="width:28px; height:28px;"></i>
        </div>
        <h3 style="font-size:16px; font-weight:700; color:#111827; margin-bottom:6px;">No food available right now</h3>
        <p style="font-size:14px; color:#6B7280;">New donations posted by partner restaurants will appear here in real time.</p>
      </div>

    </div>
  </main>

  <th:block th:replace="~{fragments/sidebar-scripts :: scripts}"></th:block>
  <script>

    function filterDonations() {
      const query = document.getElementById('searchInput').value.toLowerCase().trim();
      const cards = document.querySelectorAll('.ngo-card-item');

      cards.forEach(card => {
        const foodName = card.querySelector('.card-food-name')?.innerText.toLowerCase() || '';
        const donor = card.querySelector('.card-donor')?.innerText.toLowerCase() || '';
        const address = card.querySelector('.card-address')?.innerText.toLowerCase() || '';

        if (foodName.includes(query) || donor.includes(query) || address.includes(query)) {
          card.style.display = 'flex';
        } else {
          card.style.display = 'none';
        }
      });
    }
  </script>
</body>

</html>
