<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NGO Dashboard</title>
<link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div id="mymenu">
		<ul>
			<li><a th:href="@{/ngo/dashboard}">Dashboard</a></li>
			<li><a th:href="@{/ngo/map}">Map View</a></li>
			<li><a th:href="@{/ngo/history}">My Donations</a></li>
			<li><a th:href="@{/logout}">Logout</a></li>
		</ul>
	</div>

<div class="main-box">

<h1>Welcome, <span th:text="${name}">NGO</span> 👋</h1>

<div class="content-area">

<h2>Available Donations</h2>

<div th:if="${#lists.isEmpty(donations)}">
<p class="no-data">No donations available right now. Check back later!</p>
</div>

<table class="mytable" th:if="${!#lists.isEmpty(donations)}">
<thead>
<tr>
<th>Food Item</th>
<th>Qty</th>
<th>Expiry</th>
<th>Pickup Address</th>
<th>Donated By</th>
<th>Action</th>
</tr>
</thead>
<tbody>
<tr th:each="d : ${donations}">
<td th:text="${d.foodName}"></td>
<td th:text="${d.qty}"></td>
<td th:text="${d.expiry != null ? #temporals.format(d.expiry, 'dd MMM yyyy') : '-'}"></td>
<td th:text="${d.pickupAddress}"></td>
<td th:text="${d.restaurantName}"></td>
<td>
<a th:href="@{/ngo/accept/{id}(id=${d.id})}" onclick="return confirm('Accept this donation?')">
<button class="accept-btn">Accept</button>
</a>
</td>
</tr>
</tbody>
</table>

</div>

</div>

</body>
</html>
