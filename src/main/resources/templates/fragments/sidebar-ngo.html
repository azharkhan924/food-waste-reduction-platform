<!-- NGO Sidebar Fragment -->
<th:block th:fragment="sidebar(activePage)">

  <!-- Sidebar Overlay (mobile) -->
  <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>

  <!-- Sidebar -->
  <aside class="dash-sidebar" id="sidebar">
    <div class="sidebar-header">
      <a th:href="@{/}" class="sidebar-logo">
        <img th:src="@{/images/logo.png}" alt="FoodRescue">
      </a>
      <button class="sidebar-toggle-btn" onclick="toggleSidebarFold()" title="Fold Sidebar">
        <i data-lucide="panel-left-close" id="foldIcon"></i>
      </button>
    </div>
    <div class="sidebar-label">NGO Portal</div>
    <nav class="sidebar-nav">
      <a th:href="@{/ngo/dashboard}" class="sidebar-link" th:classappend="${activePage == 'dashboard'} ? 'active'" title="Available Food">
        <i data-lucide="layout-dashboard"></i>
        <span class="sidebar-link-text">Available Food</span>
      </a>
      <a th:href="@{/ngo/map}" class="sidebar-link" th:classappend="${activePage == 'map'} ? 'active'" title="Map View">
        <i data-lucide="map"></i>
        <span class="sidebar-link-text">Map View</span>
      </a>
      <a th:href="@{/ngo/history}" class="sidebar-link" th:classappend="${activePage == 'history'} ? 'active'" title="My Pickups">
        <i data-lucide="clipboard-list"></i>
        <span class="sidebar-link-text">My Pickups</span>
      </a>
    </nav>
    <div class="sidebar-footer">
      <a th:href="@{/logout}" class="sidebar-logout" title="Sign Out">
        <i data-lucide="log-out"></i>
        <span class="sidebar-link-text">Sign Out</span>
      </a>
    </div>
  </aside>

</th:block>
